<html lang="en-NZ"><head><meta charset="utf-8"><title>The Holy Grid</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- © Ute Poelman. All rights reserved. Terms of use: https://nugget-maths.co.nz/#terms -->
<style>
:root{--bg:#faf6ec;--fg:#2b2412;--ac:#9a6f1c;--card:#fff;--ok:#2e7d32;--bad:#b3261e;--bd:#d8c9a3;--sh:#f3e7c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a12;--fg:#f1e8d0;--ac:#e0b04a;--card:#2a2619;--ok:#7bd57f;--bad:#ff8a80;--bd:#5a4e2f;--sh:#3a3320}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 Georgia,"Times New Roman",serif}
.w{max-width:860px;margin:0 auto;padding:12px}
h1{margin:4px 0;font-size:1.6rem;color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
nav button{flex:1;min-width:130px}
button{font:inherit;padding:7px 12px;border:2px solid var(--ac);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer;margin:3px 2px}
button:hover,nav button.on{background:var(--ac);color:var(--bg)}
button.ghost{border-style:dashed}
.bub{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.bub img{height:84px;border-radius:8px;flex:none}
#say{background:var(--sh);border:2px solid var(--bd);border-radius:14px;padding:10px 14px;position:relative;flex:1}
#say:before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--bd);border-left:0}
#main{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;overflow-x:auto}
.g{border-collapse:separate;border-spacing:5px;margin:8px auto}
.g td,.g th{min-width:70px;height:54px;text-align:center;font-size:1.15rem;padding:2px 6px}
.g td{background:var(--card);border:2px solid var(--bd);border-radius:6px}
.g th.e{background:var(--sh);border-radius:6px;min-width:60px}
.g th.pick{outline:3px dashed var(--ac);cursor:pointer}.g th.cur{outline:3px solid var(--ac)}
.g td.free{outline:2px dashed var(--ac);background:var(--sh)}
.d0{background:rgba(224,176,74,.35)!important}.d1{background:rgba(80,160,220,.3)!important}.d2{background:rgba(110,190,120,.3)!important}.d3{background:rgba(200,100,160,.3)!important}
input{font:inherit;width:5.5em;padding:5px;border:2px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);text-align:center}
.cell{width:4.5em}
.ok{color:var(--ok);font-weight:bold}
.fb{min-height:1.4em;margin:6px 0;font-weight:bold}.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.big{font-size:1.2rem}.eq{font-size:1.25rem;margin:4px 0}
.chip{display:inline-block;padding:8px 14px;margin:4px;background:var(--sh);border:2px solid var(--ac);border-radius:10px;cursor:grab;font-size:1.2rem;user-select:none}
.chip.sel{background:var(--ac);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.card{border:2px solid var(--bd);border-radius:10px;padding:8px}
.chip.sel{outline:3px solid var(--ac)}.gw{display:flex;align-items:flex-end;gap:28px;justify-content:center;flex-wrap:wrap}.rm{margin-bottom:5px;text-align:center}.rb{min-width:70px;height:54px;line-height:54px;border:2px solid var(--bd);border-radius:6px;font-size:1.15rem;background:var(--card);padding:0 6px}.rb.free{outline:2px dashed var(--ac);background:var(--sh)}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;font-size:1.1rem;line-height:1.3}.fr span:first-child{border-bottom:2px solid currentColor;padding:0 6px}.hint{background:var(--sh);padding:6px 10px;border-radius:8px;margin:4px 0}
</style></head><body><div class="w">

const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const nz=(a,b)=>{let n;do n=rnd(a,b);while(!n);return n};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const T=(c,v={})=>({c,v});
const mul=(a,b)=>{const v={...a.v};for(const k in b.v)v[k]=(v[k]||0)+b.v[k];return T(a.c*b.c,v)};
const deg=t=>Object.values(t.v).reduce((a,b)=>a+b,0);
const key=v=>Object.keys(v).filter(k=>v[k]).sort().map(k=>k+v[k]).join('');
const sup=n=>n>1?'<sup>'+n+'</sup>':'';
const fv=v=>Object.keys(v).sort().filter(k=>v[k]).map(k=>k+sup(v[k])).join('');
const fT=(t,lead)=>{const a=Math.abs(t.c),vs=fv(t.v),b=(a===1&&vs)?vs:a+vs;return lead?(t.c<0?'−':'')+b:(t.c<0?' − ':' + ')+b};
const fP=ts=>ts.map((t,i)=>fT(t,i==0)).join('');
const eqT=(a,b)=>!!(a&&b)&&fP([a])===fP([b]);
const comb=ts=>{const m={};ts.forEach(t=>{const k=key(t.v);m[k]=m[k]?T(m[k].c+t.c,m[k].v):T(t.c,t.v)});return Object.values(m).filter(t=>t.c).sort((a,b)=>deg(b)-deg(a)||(key(a.v)<key(b.v)?-1:1))};
const eqP=(a,b)=>fP(comb(a))===fP(comb(b));
const pT=s=>{s=s.replace(/[\s*()]/g,'').replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');const m=s.match(/^([+-]?)(\d*)((?:[a-zA-Z](?:\^\d+)?)*)$/);if(!m||(!m[2]&&!m[3]))return null;const v={};(m[3].match(/[a-zA-Z](\^\d+)?/g)||[]).forEach(x=>{v[x[0]]=(v[x[0]]||0)+(x[1]?+x.slice(2):1)});return T((m[1]=='-'?-1:1)*(m[2]===''?1:+m[2]),v)};
const pP=s=>{s=s.replace(/[\s()]/g,'').replace(/−/g,'-');if(!s)return null;const p=s.match(/[+-]?[^+-]+/g);if(!p||p.join('')!==s)return null;const r=p.map(pT);return r.includes(null)?null:r};
const dv=(a,b)=>{if(!b.c)return null;const c=a.c/b.c;if(!Number.isInteger(c))return null;const v={...a.v};for(const k in b.v){v[k]=(v[k]||0)-b.v[k];if(v[k]<0)return null}return T(c,v)};
const hcf=(a,b)=>{const v={};for(const k in a.v)if(b.v[k])v[k]=Math.min(a.v[k],b.v[k]);return T(gcd(Math.abs(a.c),Math.abs(b.c)),v)};
const wr=t=>t.c<0?'('+fP([t])+')':fP([t]);
const main=h=>{$('#main').innerHTML=h+'<p id="fb" class="fb"></p>';const i=document.querySelector('#main input');i&&i.focus()};
const say=t=>$('#say').innerHTML=t;
const fb=(t,g)=>{const e=$('#fb');e.textContent=t;e.className='fb '+(g?'good':'bad')};
const btn=(t,f,c='')=>`<button class="${c}" onclick="${f}">${t}</button> `;
const grid=(rh,ch,cell,ca=()=>['',''],ea=()=>['',''])=>{let h='<table class="g"><tr><th></th>'+ch.map((c,j)=>{const x=ea(2+j);return `<th class="e ${x[0]}" ${x[1]}>${c}</th>`}).join('')+'</tr>';rh.forEach((r,i)=>{const x=ea(i);h+=`<tr><th class="e ${x[0]}" ${x[1]}>${r}</th>`+ch.map((_,j)=>{const c=ca(i,j);return `<td class="${c[0]}" ${c[1]}>${cell(i,j)}</td>`}).join('')+'</tr>'});return h+'</table>'};
const NAMES=['1 Expanding','2 The diagonal property','3 Factorising','4 Dividing'];
$('#nav').innerHTML=NAMES.map((n,i)=>`<button onclick="go(${i+1})">${n}</button>`).join('');
function go(n){[...$('#nav').children].forEach((b,i)=>b.classList.toggle('on',i==n-1));[0,s1,s2,s3,s4][n]()}

/* ---------- 1 EXPANDING ---------- */
let E;
function s1(){demo(0)}
function demo(d){const R=[T(2,{x:1}),T(3)],C=[T(3,{x:1}),T(-4)];
 say(["Welcome to the <b>Holy Grid</b>! We will expand <b>(2x + 3)(3x − 4)</b> using a grid. Press Next to see how to set it up.","Step 1: write the terms of the <b>first bracket</b> down the left side: 2x and +3.","Step 2: write the terms of the <b>second bracket</b> across the top: 3x and −4. The grid is now set up!","Each box is <b>row term × column term</b>. The top-left box is 2x × 3x. Your turn!"][d]);
 main(`<p class="big">Expand <b>(2x + 3)(3x − 4)</b></p>`+grid(d>=1?R.map(t=>fP([t])):['',''],d>=2?C.map(t=>fP([t])):['',''],()=>d>=3?'?':'',(i,j)=>d>=3&&!i&&!j?['d0','']:['',''])+(d<3?btn('Next',`demo(${d+1})`):btn('Try it myself!','startE({R:[T(2,{x:1}),T(3)],C:[T(3,{x:1}),T(-4)]})')))}
function genE(m){const c=()=>nz(-5,5),k=()=>nz(-9,9);let R,C;
 if(m=='var'){const L=pick([['x','y'],['a','b'],['m','n'],['a','b','c','d'],['m','n','p','q'],['p','q','r','s'],['u','v','w','z']]),l=L.length>2?L:[L[0],L[1],L[0],L[1]];R=[T(c(),{[l[0]]:1}),T(k(),{[l[1]]:1})];C=[T(c(),{[l[2]]:1}),T(k(),{[l[3]]:1})]}
 else if(m=='more'){R=[T(c(),{x:1}),T(k())];C=[T(c(),{x:2}),T(k(),{x:1}),T(k())]}
 else{R=[T(c(),{x:1}),T(k())];C=[T(c(),{x:1}),T(k())]}
 startE({R,C})}
const prods=()=>E.R.flatMap(r=>E.C.map(c=>mul(r,c)));
function startE(e){E={...e,f:{},done:0};renderE()}
function renderE(){const {R,C,f}=E,all=R.every((_,i)=>C.every((_,j)=>f[i+','+j]));
 let h=`<p class="big">Expand <b>(${fP(R)})(${fP(C)})</b></p>`+grid(R.map(t=>fP([t])),C.map(t=>fP([t])),(i,j)=>f[i+','+j]?`<span class="ok">${fP([mul(R[i],C[j])])}</span>`:`<input class="cell" id="c${i}_${j}" onchange="chkE(${i},${j})" autocomplete="off">`);
 if(!all){say('Fill each box with <b>row term × column term</b>. Press Enter to check. Multiply the numbers, add the powers, and watch the signs!');h+=btn('Show next step','showE()','ghost')}
 else if(!E.done){say('Every box is filled. Now <b>add up all the terms inside the grid</b> to write the expanded form, combining any <b>like terms</b>. (With one variable, like terms sit on the diagonal. With several variables there may be none to combine.)');h+=`<p>= <input id="ans" size="22" style="width:14em" placeholder="e.g. 3x^2+5x-7"> ${btn('Check','chkAns()')}${btn('Show answer','E.done=1;renderE()','ghost')}</p><p class="hint">Type powers with ^, like x^2. For example, 3x^2+5x-7.</p>`}
 else{say('Excellent! What would you like to do next?');h+=`<p class="big">= <b>${fP(comb(prods()))}</b></p><p>`+btn('Try a similar example',"genE('sim')")+btn('Different variables',"genE('var')")+btn('More terms in a bracket (2 × 3)',"genE('more')")+btn('Enter my own','customE()')+btn('Move on to section 2 →','go(2)','')+'</p>'}
 main(h)}
function chkE(i,j){const t=pT($(`#c${i}_${j}`).value);if(eqT(t,mul(E.R[i],E.C[j]))){E.f[i+','+j]=1;renderE()}else fb(`Not quite. Multiply ${wr(E.R[i])} × ${wr(E.C[j])}: numbers first, then the letters.`)}
function showE(){for(let i=0;i<E.R.length;i++)for(let j=0;j<E.C.length;j++)if(!E.f[i+','+j]){E.f[i+','+j]=1;return renderE()}}
function chkAns(){const p=pP($('#ans').value);if(p&&eqP(p,prods())){E.done=1;renderE()}else fb('Not yet. Check that you included every box, combined any like terms, and kept the signs right.')}
function customE(){say('Enter two brackets (without the outer brackets), using any letters, e.g. <b>2a+3b</b> and <b>c-4d</b>, or <b>x^2-4x+1</b>. Use up to 4 terms each.');main(`<p>First bracket: <input id="ca" style="width:12em"> second bracket: <input id="cb" style="width:12em"> ${btn('Go','goE()')}</p>`)}
function goE(){const R=pP($('#ca').value),C=pP($('#cb').value);if(!R||!C||R.length>4||C.length>4)return fb('I could not read that. Try something like 2x+3.');startE({R:comb(R),C:comb(C)})}

/* ---------- 2 DIAGONAL PROPERTY ---------- */
let G;
function s2(){G=[genE2(),genE2()];G.n=0;r2()}
function genE2(){const c=()=>nz(-5,5),k=()=>nz(-9,9);return {R:[T(c(),{x:1}),T(k())],C:[T(c(),{x:1}),T(k())],ok:[0,0]}}
function r2(){const all=G.every(g=>g.ok[0]&&g.ok[1]);
 say(G.n?'You discovered the <b>diagonal property</b>! Here is why it always works.':all?'Look at your answers for both grids. What do you notice?':'Here are two completed grids. <b>Multiply the two entries on each diagonal</b>, then compare.');
 let h='<div class="row">';
 G.forEach((g,k)=>{const c=(i,j)=>mul(g.R[i],g.C[j]),ds=[[c(0,0),c(1,1)],[c(0,1),c(1,0)]];
  h+=`<div class="card"><b>Grid ${k+1}</b>`+grid(g.R.map(t=>fP([t])),g.C.map(t=>fP([t])),(i,j)=>fP([c(i,j)]),(i,j)=>[i==j?'d0':'d1',''])+[0,1].map(m=>`<p>${m?'↗':'↘'} ${wr(ds[m][0])} × ${wr(ds[m][1])} = `+(g.ok[m]?`<span class="ok">${fP([mul(ds[m][0],ds[m][1])])}</span>`:`<input id="d${k}${m}" onchange="chkD(${k},${m})">`)+'</p>').join('')+'</div>'});
 h+='</div>';
 if(all&&!G.n)h+=`<p class="big">What do you notice?</p>`+btn('The two diagonal products are always equal','G.n=1;r2()')+btn('The ↘ diagonal is always bigger',"fb('Compare your two answers in each grid again.')")+btn('There is no pattern',"fb('Look closely at the two answers in each grid.')");
 if(G.n)h+=`<div class="hint"><p>Call the outside terms <b>a, b</b> (rows) and <b>c, d</b> (columns):</p>`+grid(['a','b'],['c','d'],(i,j)=>['ac','ad','bc','bd'][2*i+j],(i,j)=>[i==j?'d0':'d1',''])+`<p>↘ <b>ac</b> × <b>bd</b> = a × b × c × d<br>↗ <b>ad</b> × <b>bc</b> = a × b × c × d (same four terms, different order)</p><p><b>So the two diagonals always have the same product!</b> Next we use this to work backwards.</p></div>`;
 h+='<p>'+btn('Try two new grids','s2()','ghost')+btn('Move on to section 3 →','go(3)')+'</p>';main(h)}
function chkD(k,m){const g=G[k],c=(i,j)=>mul(g.R[i],g.C[j]),e=m?mul(c(0,1),c(1,0)):mul(c(0,0),c(1,1));if(eqT(pT($(`#d${k}${m}`).value),e)){g.ok[m]=1;r2()}else fb('Not quite. Multiply the numbers, then add the powers of x.')}

/* ---------- 3 FACTORISING ---------- */
let F;
const fac=n=>{const r=[];for(let i=1;i<=Math.abs(n);i++)if(n%i==0)r.push(i);return r};
const findPair=(s,pr)=>{const m=Math.abs(pr)+Math.abs(s)+1;for(let a=-m;a<=m;a++)if(a*(s-a)==pr)return[a,s-a];return null};
function s3(){genF('sim')}
function genF(m){if(m=='four')return genF4();let a,b,c,d,vq={x:2},vl={x:1},vc={};
 if(m=='two'){const [u,w]=pick([['x','y'],['a','b'],['m','n'],['p','q']]);vq={[u]:2};vl={[u]:1,[w]:1};vc={[w]:2}}
 if(m=='dots'){a=rnd(1,5);b=rnd(1,9);c=a;d=-b}else do{a=rnd(1,3);c=rnd(1,3);b=nz(-9,9);d=nz(-9,9)}while(a*d+b*c==0);
 startF(a*c,a*d+b*c,b*d,vq,vl,vc)}
function genF4(){const [u,w]=pick([['x','y'],['a','b'],['m','n'],['p','q']]),a=rnd(1,4),c=rnd(1,4),big=()=>pick([-1,1])*rnd(2,7),b=big(),d=big();
 startF(0,0,0,{},{},{},comb([T(a*c,{[u]:1,[w]:1}),T(a*d,{[u]:1}),T(b*c,{[w]:1}),T(b*d)]))}
function startF(p,q,r,vq,vl,vc,four){F={p,q,r,vq,vl,vc,four,sh:[0,1,2,3].sort(()=>Math.random()-.5),cells:[0,0,0,0],sel:null,cur:null,stage:four||q?1:0,hints:0,sub:0,ed:[0,0,0,0],ord:[],pick:null,reveal:0};r3()}
function cT(i){const c=F.cells[i];return c[0]=='T'?F.four[+c[1]]:c=='Q'?T(F.p,F.vq):c=='C'?T(F.r,F.vc):T(F.nums[c=='L'?0:1],F.vl)}
function r3(){const {p,q,r,stage:st}=F,pr=p*r,VL=fv(F.vl),Q=fP([T(p,F.vq)]),Rr=fP([T(r,F.vc)]),L=fP([T(q,F.vl)]),PD=fP([mul(T(p,F.vq),T(r,F.vc))]);
 const ex=F.four?fP(F.four):fP([T(p,F.vq),...(st||q?[T(q,F.vl)]:[]),T(r,F.vc)]);
 let h=`<p class="big">Factorise <b>${ex}</b></p>`,panel='';
 const hs=[()=>pr>0?`The product ${pr} is positive, so the two numbers have the <b>same sign</b>. The sum ${q} is ${q>0?'positive, so both are positive':'negative, so both are negative'}.`:`The product ${pr} is negative, so <b>one is positive and one is negative</b>. `+(q>0?'The sum is positive, so the number with the bigger size is the positive one.':q<0?'The sum is negative, so the number with the bigger size is the negative one.':'The sum is zero, so they are opposites.'),()=>`Find all positive factor pairs of ${Math.abs(pr)}: `+fac(pr).filter(x=>x<=Math.sqrt(Math.abs(pr))).map(x=>`${x} × ${Math.abs(pr)/x}`).join(', ')+'.',()=>{const z=findPair(q,pr);return `Which pair can give a sum of ${q} with the right signs? Try ${z[0]} and ${z[1]}.`}];
 if(st==0){say(`There is no middle term! Use the <b>smart zero</b>: write <b>+ 0${VL}</b>. Then it looks like all the others.`);panel=btn('Insert the smart zero','F.stage=1;r3()')}
 if(st==1){say(F.four?'This expression has <b>four terms and no like terms</b>. Drag (or tap, then tap a box) each term inside the grid so that terms <b>next to each other</b> (in the same row or column) share a common factor.':`Factorising is <b>expanding backwards</b>. The expression goes <b>inside</b> the grid. Drag (or tap a term, then tap a box) the ${Q} and ${Rr} terms into the grid. They must be <b>diagonally opposite</b>. Then place the ${L} term.`);
  const ch=F.four?F.sh.map(i=>['T'+i,fP([F.four[i]])]):[['Q',Q],['C',Rr],['L',L]];
  panel=`<p>Terms to place:</p>`+ch.filter(x=>!F.cells.includes(x[0])&&!(x[0]=='L'&&F.cells.includes('M'))).map(x=>`<span class="chip ${F.pick==x[0]?'sel':''}" draggable="true" ondragstart="dragS(event,'${x[0]}')" onclick="F.pick='${x[0]}';r3()">${x[1]}</span>`).join('')+(F.four?btn('Clear the grid','F.cells=[0,0,0,0];r3()','ghost'):'')}
 if(st==2){const sb=F.sub,hl=sb==0?[`The two boxes hold <b>like terms</b>: □${VL} + □${VL}. Adding them must give the middle term of the original expression, ${L}.`]:sb==1?[`The diagonal property says both diagonals have the same product. Which diagonal do you already know completely?`,`(${Q}) × (${Rr}) = ${PD}. So (□${VL}) × (□${VL}) must make the same product.`]:hs.slice(0,3).map(f=>f());
  const hb=F.hints<hl.length?btn('Give me a hint','F.hints++;r3()','ghost'):(sb==2?btn('Show the numbers','F.reveal=1;r3()','ghost'):'');
  const hh=hl.slice(0,F.hints).map(x=>`<div class="hint">${x}</div>`).join('');
  if(sb==0){say(`The ${L} must be split into <b>two ${VL}-terms</b>, but we do not know how yet. Both new boxes are like terms. Think about what they must add up to.`);panel=`<div class="eq">□ + □ = <input id="sq"></div><p>What do the two numbers add up to? ${btn('Check','chkSum()')}${hb}</p>`+hh}
  if(sb==1){say(`The sum is not enough on its own. Use the <b>diagonal property</b>: the two diagonals must have the same product. One diagonal is the ${Q} and the ${Rr}. The other is our two new terms.`);panel=`<div class="eq">□ + □ = ${q}</div><div class="eq">□ × □ = <input id="pq"></div><p>What do the two numbers multiply to? ${btn('Check','chkProd()')}${hb}</p>`+hh}
  if(sb==2){say(`Now find the two numbers: they add to ${q} and multiply to ${pr}. Type them into the grid (any order).`);panel=`<div class="eq">□ + □ = ${q}</div><div class="eq">□ × □ = ${pr}</div><p>${btn('Check','chkN()')}${hb}</p>`+hh+(F.hints>=3&&!findPair(q,pr)?'<div class="hint">No pair works, so this cannot be factorised.</div>':'')}}
 if(st==3){const I=F.sel==null?null:info();say(F.sel==null?'All four boxes are filled! Now choose a <b>row or column</b> and take out its highest common factor (HCF). Tap one of the edge squares.':'Good. Once we have the first edge, the rest fall into place: ask “what times this makes that?” <b>Type your answer in the highlighted edge box.</b>');
  panel=F.sel==null?'<p>👆 Tap an edge square to choose a row or column.</p>':`<p class="big">${I.t}</p>${btn('Check','chkEdge()')}${btn('Show next step','showEdge()','ghost')}`}
 if(st==4&&!F.done){say('All four edges are done, and the last one matched the remaining box (the double check). Now <b>read off the brackets</b>: the terms down the left edge go in one bracket and the terms across the top go in the other. Type the factorised expression.');panel=`<p class="big">${ex} = <input id="fa" style="width:14em" placeholder="e.g. (2x+3)(x-4)"></p>`+btn('Check','chkFa()')+btn('Show answer','F.done=1;r3()','ghost')}
 if(st==4&&F.done){const e=F.ed;say('Well done! You have factorised it. Check it by expanding if you like. What next?');panel=`<p class="big">${ex} = <b>(${fP([e[0],e[1]])})(${fP([e[2],e[3]])})</b></p><p>Practise:</p>`+btn('Similar example','genF(\'sim\')')+btn('Two variables','genF(\'two\')')+btn('Difference of two squares','genF(\'dots\')')+btn('Four terms','genF(\'four\')')+btn('My own','customF()')+btn('Move on to section 4 →','go(4)')}
 const I3=st==3&&F.sel!=null?info():null,ed=k=>F.ed[k]?fP([F.ed[k]]):(st==3&&F.cur==k?'<input class="cell" id="ei">':'');
 h+=grid([ed(0),ed(1)],[ed(2),ed(3)],(i,j)=>{const k=2*i+j,c=F.cells[k];if(!c)return '';if(st==2&&F.sub<2&&(c=='L'||c=='M'))return `□${VL}`;if(st==2&&(c=='L'||c=='M'))return `<input class="cell" id="n${c=='L'?0:1}" value="${F.reveal?findPair(q,pr)[c=='L'?0:1]:''}">${VL}`;return fP([cT(k)])},(i,j)=>{const k=2*i+j;if(I3&&I3.cells.includes(k))return['d0',''];if(st==2&&F.sub>=1&&F.cells[k])return[F.cells[k]=='Q'||F.cells[k]=='C'?'d0':'d1',''];return st==1&&!F.cells[k]?['free',`ondragover="event.preventDefault()" ondrop="drop(event,${k})" onclick="if(F.pick)place(${k},F.pick)"`]:['','']},k=>st==3&&F.sel==null?['pick',`onclick="edgeClick(${k})"`]:[F.cur==k&&st==3?'cur':'','']);
 main(h+panel)}
function dragS(e,c){e.dataTransfer.setData('text',c);F.pick=c}
function drop(e,i){e.preventDefault();place(i,e.dataTransfer.getData('text')||F.pick)}
function place(i,ch){if(F.stage!=1||F.cells[i]||!ch)return;const c=F.cells;let m='';
 if(F.four){const t=F.four[+ch[1]],bad=[i^1,i^2].some(n=>{if(!c[n])return false;const h=hcf(t,cT(n));return h.c==1&&!Object.keys(h.v).length});
  if(bad)m='Those two share a row or column, but they have no common factor. Terms next to each other must share one.';
  else{c[i]=ch;if(c.every(x=>x)){if(eqT(mul(cT(0),cT(3)),mul(cT(1),cT(2))))F.stage=3;else{c[i]=0;m='That arrangement breaks the diagonal property: the two diagonals must multiply to the same product. Clear the grid and try a different arrangement.'}}}}
 else{const qi=c.indexOf('Q'),ci=c.indexOf('C');
  if(ch=='L'){if(qi<0||ci<0)m='Place the quadratic term and the constant term first.';else{c[i]='L';c[c.indexOf(0)]='M';F.stage=2;F.sub=0;F.hints=0}}
  else{const o=ch=='Q'?ci:qi;if(o>=0&&o!=3-i)m='Not there! The quadratic term and the constant term must be diagonally opposite each other.';else c[i]=ch}}
 F.pick=null;r3();if(m)fb(m)}
function chkFa(){const m=$('#fa').value.replace(/\s/g,'').match(/^\(([^()]+)\)\(([^()]+)\)$/);const A=m&&pP(m[1]),B=m&&pP(m[2]);if(!A||!B)return fb('Type two brackets, like (2x+3)(x-4).');
 const e=F.ed,r=[e[0],e[1]],c=[e[2],e[3]],ng=l=>l.map(t=>T(-t.c,t.v)),ok=(x,y)=>(eqP(A,x)&&eqP(B,y))||(eqP(A,y)&&eqP(B,x));
 if(ok(r,c)||ok(ng(r),ng(c)))return F.done=1,r3();
 const tot=F.four?F.four:[T(F.p,F.vq),T(F.q,F.vl),T(F.r,F.vc)];
 fb(eqP(A.flatMap(a=>B.map(b=>mul(a,b))),tot)?'That does multiply out correctly, but read the brackets from the edges of your grid.':'Not quite. Use the two terms down the left edge for one bracket and the two terms across the top for the other.')}
function chkSum(){const t=$('#sq').value.trim();if(t!==''&&+t==F.q){F.sub=1;F.hints=0;r3();fb('Yes! Like terms add to the middle term.',1)}else fb(`Not quite. The two new terms must add up to the middle term of ${fP([T(F.p,F.vq),T(F.q,F.vl),T(F.r,F.vc)])}. What is its coefficient?`)}
function chkProd(){const t=$('#pq').value.trim(),pr=F.p*F.r;if(t!==''&&+t==pr){F.sub=2;F.hints=0;r3();fb('Yes! Now find the two numbers.',1)}else fb('Not quite. Multiply the two terms on the diagonal you already know. Remember to include the signs!')}
function chkN(){const a=$('#n0').value.trim(),b=$('#n1').value.trim(),x=+a,y=+b,pr=F.p*F.r;if(a===''||b===''||isNaN(x)||isNaN(y))return fb('Enter a number in each box.');
 if(x+y==F.q&&x*y==pr){F.nums=[x,y];F.stage=3;r3()}else fb(`${x} + ${y} = ${x+y} (we need ${F.q}) and ${x} × ${y} = ${x*y} (we need ${pr}). Both must work!`)}
function edgeClick(k){if(F.sel!=null)return;F.sel=F.cur=k;r3()}
function info(){const k=F.cur;if(k==F.sel){const cs=k<2?[2*k,2*k+1]:[k-2,k],a=cT(cs[0]),b=cT(cs[1]);return{t:`What is the highest common factor of ${fP([a])} and ${fP([b])}?`,exp:hcf(a,b),hc:1,a,b,cells:cs}}
 let ci,kn;if(k<2){const j=F.ed[2]?0:1;kn=F.ed[2+j];ci=2*k+j}else{const j=k-2,i=F.ed[0]?0:1;kn=F.ed[i];ci=2*i+j}
 const c=cT(ci);return{t:`${fP([kn])} × what = ${fP([c])}?`,exp:dv(c,kn),cells:[ci]}}
function accept(t){F.ed[F.cur]=t;if(F.cur==F.sel)F.ord=F.sel<2?[2,3,1-F.sel]:[0,1,5-F.sel];const n=F.ord.find(k=>!F.ed[k]);if(n===undefined)F.stage=4;else F.cur=n;r3()}
function chkEdge(){const I=info(),t=pT($('#ei').value);if(I.hc?(eqT(t,I.exp)||eqT(t,T(-I.exp.c,I.exp.v))):eqT(t,I.exp))accept(t);else if(I.hc&&t&&dv(I.a,t)&&dv(I.b,t))fb('That divides both, but is it the highest common factor?');else fb('Not quite. Think: what multiplies by the first thing to make the second?')}
function showEdge(){accept(info().exp)}
function customF(){say('Type a quadratic with one variable, like <b>x^2+5x+6</b> or <b>4x^2-25</b>, or with two variables, like <b>2x^2+7xy+3y^2</b>. I will check whether it can be factorised first.');main(`<p><input id="cf" style="width:14em"> ${btn('Check and start','goF()')}</p>`)}
function goF(){const t=pP($('#cf').value);if(!t)return fb('I could not read that. Try x^2+5x+6');const c=comb(t),vs=[...new Set(c.flatMap(x=>Object.keys(x.v)))].sort();
 if(vs.length<1||vs.length>2)return fb('Please use one or two variables.');
 const vq={[vs[0]]:2},vl=vs.length==1?{[vs[0]]:1}:{[vs[0]]:1,[vs[1]]:1},vc=vs.length==1?{}:{[vs[1]]:2},ms=[vq,vl,vc];
 if(c.some(x=>!ms.some(m=>key(m)==key(x.v))))return fb('That is not a quadratic of the form ax² + bx + c (or ax² + bxy + cy²).');
 const g=m=>(c.find(x=>key(x.v)==key(m))||{c:0}).c,p=g(vq),q=g(vl),r=g(vc);
 if(!p)return fb('There needs to be a squared term.');if(!r)return fb('There is no constant term. Take out the common factor first, then try again.');
 if(!findPair(q,p*r))return fb(`No two whole numbers add to ${q} and multiply to ${p*r}, so this cannot be factorised.`);fb('It can be factorised!',1);startF(p,q,r,vq,vl,vc)}

/* ---------- 4 DIVIDING ---------- */
let D;
function s4(){genD(0,1)}
function genD(rem,first){const a=pick([1,1,2]),b=nz(-6,6),q=[nz(-4,4),nz(-4,4),nz(-4,4)],r=rem?nz(-9,9):0;
 D={a,b,q,r,P:[b*q[2]+r,a*q[2]+b*q[1],a*q[1]+b*q[0],a*q[0]],step:0,pick:null,steps:['drag','top0','bot0','in1','top1','bot1','in2','top2','bot2','rem']};r4()}
function r4(){const {a,b,q,r,P}=D,d0=T(a,{x:1}),d1=T(b),qT=j=>T(q[j],{x:2-j}),kn=k=>D.steps.indexOf(k)<D.step,cur=D.steps[D.step],dv0=fP([d0,d1]);
 const c0=j=>T(a*q[j],{x:3-j}),c1=j=>T(b*q[j],{x:2-j}),dr=cur=='drag',INP='<input class="cell" id="di">',tg=(i,j)=>cur=='rem'?(i&&j==3):j<3&&cur==(i?'bot'+j:'in'+j);
 const divd=[3,2,1,0].filter(k=>P[k]).map((k,i)=>`<span class="d${k}">${fT(T(P[k],{x:k}),i==0)}</span>`).join('');
 let h=`<p class="big">Divide <b>${divd}</b> by <b>(${dv0})</b></p>`+'<div class="gw">'+grid([fP([d0]),fP([d1])],[0,1,2].map(j=>kn('top'+j)?fP([qT(j)]):cur=='top'+j?INP:'?'),(i,j)=>{if(!i)return (j?kn('in'+j):kn('drag'))?fP([c0(j)]):cur=='in'+j?INP:'';return kn('bot'+j)?fP([c1(j)]):cur=='bot'+j?INP:''},(i,j)=>[(j<3?`d${(1-i)+(2-j)}`:i?'d0':'')+(tg(i,j)?' free':''),dr?`ondragover="event.preventDefault()" ondrop="dropD(event,${i},${j})" onclick="if(D.pick!=null)placeD(D.pick,${i},${j})"`:''],k=>k>=2&&cur=='top'+(k-2)?['cur','']:['',''])+'<div class="rm"><small>remainder</small><div class="rb '+(kn('rem')?'d0':cur=='rem'?'free':'')+'">'+(kn('rem')?fP([T(r)]):cur=='rem'?INP:'')+'</div></div></div>';
 if(cur=='drag'){say(`Division is <b>expanding backwards</b>! The divisor goes down the left side, the answer goes along the top, and the dividend goes inside, with each power on its own diagonal (same colour). Start by dragging the term with the <b>highest power</b> into the top-left corner.`);
  h+='<p>Dividend terms (drag, or tap then tap a box):</p>'+[3,2,1,0].filter(k=>P[k]).map(k=>`<span class="chip d${k} ${D.pick===k?'sel':''}" draggable="true" ondragstart="dragD(event,${k})" onclick="D.pick=${k};r4()">${fP([T(P[k],{x:k})])}</span>`).join('')+btn('Show next step','D.step++;r4()','ghost')}
 else if(cur){const t=cur=='rem'?'rem':cur.slice(0,-1),j=+cur.slice(-1);let m,pr;
  if(t=='top'){D.ex=qT(j);pr=`${fP([d0])} × ? = ${fP([c0(j)])}`;m=j?`Now the top edge for this column: ${fP([d0])} times what makes ${fP([c0(j)])}?`:`Now the top edge: ${fP([d0])} times what makes the term in the corner, ${fP([c0(0)])}?`}
  if(t=='bot'){D.ex=c1(j);pr=`${fP([d1])} × ${wr(qT(j))} = ?`;m=`Complete the column: the bottom box is the second divisor term times the top entry.`}
  if(t=='in'){const k=3-j;D.ex=c0(j);pr=`${wr(c1(j-1))} + ? = ${fP([T(P[k],{x:k})])}`;m=`Terms on the same diagonal must add up to the dividend term. The ${fP([T(1,{x:k})])} diagonal needs to total ${fP([T(P[k],{x:k})])}, and we already have ${fP([c1(j-1)])}. What goes in the next inside box?`}
  if(t=='rem'){D.ex=T(r);pr=`${wr(c1(2))} + ? = ${P[0]}`;m=`The constant diagonal must total ${P[0]}. What is left over is the <b>remainder</b>.`}
  say(m+' <b>Type your answer in the highlighted box.</b>');h+=`<p class="big">${pr}</p>${btn('Check','chkD4()')}${btn('Show next step','D.step++;r4()','ghost')}`}
 else h+=fin();
 main(h)}
function dragD(e,k){e.dataTransfer.setData('text',k);D.pick=k}
function dropD(e,i,j){e.preventDefault();const k=e.dataTransfer.getData('text');placeD(k===''?D.pick:+k,i,j)}
function placeD(k,i,j){let m='';if(k!==3)m='Start with the term that has the highest power.';else if(i||j)m='It belongs in the top-left corner: the same row as the highest power of the divisor.';else{D.step++;D.pick=null;return r4()}D.pick=null;r4();fb(m)}
function fin(){const {a,b,q,r}=D,dv0=fP([T(a,{x:1}),T(b)]);say(r?'Done! When the remainder is not zero, it goes over the divisor.':'Done! The remainder is zero, so it divides exactly.');
 return `<p class="big">= <b>${fP([T(q[0],{x:2}),T(q[1],{x:1}),T(q[2])])}</b>${r?` ${r<0?'−':'+'} <span class="fr"><span>${Math.abs(r)}</span><span>${dv0}</span></span>`:''}</p><p>`+btn('Another (no remainder)','genD(0)')+btn('Try one with a remainder','genD(1)')+btn('← Back to expanding','go(1)','ghost')+'</p>'}
function chkD4(){if(eqT(pT($('#di').value),D.ex)){D.step++;r4()}else fb('Not quite. Check your signs and powers.')}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'&&!e.target.onchange){const b=[...document.querySelectorAll('#main button')].find(b=>/^(Check|Go)/.test(b.textContent.trim()));b&&b.click()}});
go(1);
</script>
